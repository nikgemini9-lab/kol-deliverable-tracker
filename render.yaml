services:
  - type: web
    name: kol-deliverable-tracker
    runtime: node
    branch: claude/kol-tracker-app-Xadww
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RETTIWT_API_KEY
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
